<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirMart – Tržiště čerstvého vzduchu</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f9f5;
      --surface:   #ffffff;
      --surface2:  #eef5ee;
      --green:     #2d7a4f;
      --green-mid: #3fa06a;
      --green-lt:  #c8ead8;
      --teal:      #1a8a7a;
      --amber:     #e8a020;
      --red:       #d94f4f;
      --text:      #1a2e22;
      --text-mid:  #4a6655;
      --text-muted:#88a898;
      --border:    #d8e8df;
      --radius:    20px;
      --radius-sm: 12px;
      --shadow:    0 2px 16px rgba(45,122,79,.09);
      --shadow-lg: 0 12px 48px rgba(45,122,79,.16);
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 70% 55% at 8%   2%,  #dff0e6 0%, transparent 60%),
        radial-gradient(ellipse 50% 65% at 92%  95%, #d4ecdf 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 55%  50%, #edf7f0 0%, transparent 60%);
    }

    /* ── HEADER ───────────────────────────────── */
    .header {
      background: var(--green);
      color: #fff;
      padding: 2.75rem 2rem 2.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.07) 120px, transparent 120px),
        radial-gradient(circle at 88% 80%, rgba(255,255,255,.05) 90px,  transparent 90px);
    }

    .header-inner { position: relative; z-index: 1; }

    .logo {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      color: #fff;
    }
    .logo em {
      font-style: normal;
      color: #7de0b0;
    }
    .tagline {
      margin-top: .55rem;
      font-size: .9rem;
      font-weight: 300;
      opacity: .65;
      letter-spacing: .02em;
    }

    /* ── NAV BAR ──────────────────────────────── */
    .navbar {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1.5px solid var(--border);
      padding: .8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 12px rgba(45,122,79,.06);
    }
    .navbar .count {
      font-size: .875rem;
      color: var(--text-muted);
    }
    .navbar .count b { color: var(--green); }

    /* ── BUTTONS ──────────────────────────────── */
    .btn {
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition: all .17s;
    }
    .btn:active { transform: scale(.95) !important; }

    .btn-add {
      background: var(--amber);
      color: #fff;
      padding: .6rem 1.45rem;
      font-size: .88rem;
      box-shadow: 0 4px 16px rgba(232,160,32,.3);
    }
    .btn-add:hover { filter: brightness(1.08); transform: translateY(-2px); }

    .btn-primary {
      background: var(--green);
      color: #fff;
      padding: .65rem 1.6rem;
      font-size: .93rem;
    }
    .btn-primary:hover { background: #235f3d; transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      padding: .65rem 1.2rem;
      font-size: .93rem;
    }
    .btn-ghost:hover { border-color: var(--green-mid); color: var(--text); }

    .btn-buy {
      background: var(--teal);
      color: #fff;
      padding: .5rem 1.15rem;
      font-size: .83rem;
      box-shadow: 0 3px 10px rgba(26,138,122,.22);
    }
    .btn-buy:hover { background: #147065; transform: scale(1.05); }

    /* ── MAIN ─────────────────────────────────── */
    .main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── FORM PANEL ───────────────────────────── */
    .form-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.75rem;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-lg);
      border: 1.5px solid var(--border);
      animation: slideDown .28s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-panel h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: .32rem; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: .75rem;
      font-weight: 700;
      color: var(--text-mid);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .field input,
    .field textarea {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .68rem 1rem;
      font-family: inherit;
      font-size: .93rem;
      color: var(--text);
      background: var(--surface2);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      resize: vertical;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: var(--green-mid);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(63,160,106,.14);
    }
    .field.invalid input,
    .field.invalid textarea { border-color: var(--red); }
    .field .err { font-size: .76rem; color: var(--red); font-weight: 600; }

    .form-actions {
      display: flex;
      gap: .7rem;
      margin-top: 1.4rem;
      justify-content: flex-end;
    }

    /* ── SECTION HEADING ──────────────────────── */
    .section-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .section-title span {
      font-size: .8rem;
      font-weight: 600;
      background: var(--green-lt);
      color: var(--green);
      padding: .2rem .65rem;
      border-radius: 50px;
    }

    /* ── PRODUCT GRID ─────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 1.5rem;
    }

    /* ── PRODUCT CARD ─────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform .22s, box-shadow .22s, border-color .22s;
      animation: cardIn .38s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--green-lt);
    }

    .card-thumb {
      height: 175px;
      background: linear-gradient(135deg, #d0f0e0 0%, #a8dfc4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
    }
    .card-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 80%, rgba(255,255,255,.6) 8px, transparent 8px),
        radial-gradient(circle at 78% 20%, rgba(255,255,255,.5) 6px, transparent 6px),
        radial-gradient(circle at 50% 65%, rgba(255,255,255,.4) 4px, transparent 4px);
    }

    .badge {
      position: absolute;
      top: 12px; right: 12px;
      background: var(--amber);
      color: #fff;
      font-size: .66rem;
      font-weight: 700;
      padding: .22rem .6rem;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: .07em;
      z-index: 1;
      box-shadow: 0 3px 10px rgba(232,160,32,.4);
    }

    .card-body {
      padding: 1.25rem 1.35rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .4rem;
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
    }

    .card-desc {
      font-size: .855rem;
      color: var(--text-mid);
      font-weight: 400;
      line-height: 1.55;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .95rem 1.35rem 1.1rem;
      border-top: 1.5px solid var(--border);
      background: var(--surface2);
    }

    .card-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -.02em;
    }
    .card-price small {
      font-size: .68rem;
      font-weight: 400;
      color: var(--text-muted);
      display: block;
    }

    /* ── EMPTY STATE ──────────────────────────── */
    .empty {
      text-align: center;
      padding: 4.5rem 1rem;
      grid-column: 1 / -1;
    }
    .empty .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .empty p { color: var(--text-muted); font-size: 1rem; }

    /* ── TOAST ────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(160%);
      background: var(--green);
      color: #fff;
      padding: .85rem 1.7rem;
      border-radius: 50px;
      font-size: .88rem;
      font-weight: 600;
      box-shadow: 0 10px 36px rgba(45,122,79,.35);
      z-index: 999;
      white-space: nowrap;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── MODAL (sdílený) ──────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,25,16,.5);
      backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2.25rem 2rem 2rem;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 28px 80px rgba(20,60,35,.25);
      border: 1.5px solid var(--border);
      transform: scale(.9) translateY(24px);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      text-align: center;
    }
    .overlay.open .modal { transform: scale(1) translateY(0); }

    .modal-icon { font-size: 2.8rem; margin-bottom: .6rem; line-height: 1; }
    .modal h3 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: .4rem;
    }
    .modal p {
      font-size: .875rem;
      color: var(--text-mid);
      margin-bottom: 1.35rem;
      line-height: 1.55;
    }

    /* buy modal specifics */
    .buy-detail {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      text-align: left;
      margin-bottom: 1.5rem;
      border: 1.5px solid var(--border);
    }
    .buy-detail .row {
      display: flex;
      justify-content: space-between;
      font-size: .875rem;
      color: var(--text-mid);
      padding: .3rem 0;
    }
    .buy-detail .row:not(:last-child) { border-bottom: 1px solid var(--border); }
    .buy-detail .row b { color: var(--text); }
    .buy-detail .price-row { font-size: 1.05rem; font-weight: 800; color: var(--green); }

    /* pw modal specifics */
    .pw-wrap { position: relative; margin-bottom: .5rem; }
    .pw-wrap input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .75rem 3rem .75rem 1.1rem;
      font-family: inherit;
      font-size: 1rem;
      text-align: center;
      letter-spacing: .12em;
      color: var(--text);
      background: var(--surface2);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .pw-wrap input:focus {
      border-color: var(--green-mid);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(63,160,106,.14);
    }
    .pw-wrap input.err-border { border-color: var(--red); }

    .eye-btn {
      position: absolute;
      right: .75rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; font-size: 1.1rem;
      color: var(--text-muted); padding: .2rem;
    }

    .modal-err {
      font-size: .79rem;
      color: var(--red);
      min-height: 1.2rem;
      margin-bottom: .9rem;
      font-weight: 600;
    }

    .modal-actions { display: flex; gap: .65rem; }
    .modal-actions .btn-primary { flex: 1; }
    .modal-actions .btn-ghost   { flex: 0 0 auto; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .pw-wrap.shake input { animation: shake .4s ease; }

    /* ── FOOTER ───────────────────────────────── */
    .footer {
      text-align: center;
      padding: 1.75rem;
      font-size: .78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    const STORAGE_KEY = 'airmart_products';
    const CORRECT_PW  = 'jejux';

    const DEFAULTS = [
      { id: 1, name: 'Čerstvý vzduch v pytlíku – Originál',  desc: 'Náš bestseller. Vzduch pečlivě nasbíraný v českých horách, balený za úsvitu. Bez konzervantů, bez přidaného kyslíku.', price: 49,  isNew: false },
      { id: 2, name: 'Alpský vzduch Premium',                desc: 'Luxusní směs ze švýcarských Alp ve výšce 3 000 m n. m. Krystalicky čistý, s nádechem sněhu a svobody.',                price: 199, isNew: false },
      { id: 3, name: 'Mořský vánek – edice léto',            desc: 'Jemně osolený vzduch z pobřeží Jadranského moře. Ideální pro domácí saunování nebo meditaci.',                           price: 89,  isNew: false },
    ];

    function loadProducts() {
      try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch {}
      return DEFAULTS;
    }
    function saveProducts(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /* ── Toast ─────────────────────────────────── */
    function Toast({ msg, show }) {
      return <div className={`toast${show ? ' show' : ''}`}>{msg}</div>;
    }

    /* ── Buy Confirmation Modal ─────────────────── */
    function BuyModal({ product, onClose }) {
      const open = !!product;
      const price = product ? Number(product.price).toLocaleString('cs-CZ') : '';
      const handleOverlay = e => { if (e.target === e.currentTarget) onClose(); };
      return (
        <div className={`overlay${open ? ' open' : ''}`} onClick={handleOverlay}>
          <div className="modal">
            <div className="modal-icon">🎉</div>
            <h3>Děkujeme za nákup!</h3>
            <p>Váš pytlík čerstvého vzduchu je na cestě. 💨</p>
            {product && (
              <div className="buy-detail">
                <div className="row"><span>Produkt</span><b>{esc(product.name)}</b></div>
                <div className="row price-row"><span>Cena</span><b>{price} Kč</b></div>
              </div>
            )}
            <button className="btn btn-primary" style={{width:'100%'}} onClick={onClose}>
              Zavřít
            </button>
          </div>
        </div>
      );
    }

    /* ── Password Modal ─────────────────────────── */
    function PwModal({ open, onSuccess, onClose }) {
      const [pw, setPw]         = useState('');
      const [show, setShow]     = useState(false);
      const [err, setErr]       = useState('');
      const [shake, setShake]   = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (open) { setPw(''); setErr(''); setShow(false); setTimeout(() => ref.current?.focus(), 200); }
      }, [open]);

      const confirm = () => {
        if (pw === CORRECT_PW) { onSuccess(); }
        else {
          setErr('❌ Špatné heslo. Zkuste to znovu.');
          setShake(true); setPw('');
          setTimeout(() => { setShake(false); ref.current?.focus(); }, 420);
        }
      };

      const handleOverlay = e => { if (e.target === e.currentTarget) onClose(); };

      return (
        <div className={`overlay${open ? ' open' : ''}`} onClick={handleOverlay}>
          <div className="modal">
            <div className="modal-icon">🔐</div>
            <h3>Chráněná sekce</h3>
            <p>Pro přidání produktu zadejte heslo správce.</p>
            <div className={`pw-wrap${shake ? ' shake' : ''}`}>
              <input
                ref={ref}
                type={show ? 'text' : 'password'}
                value={pw}
                onChange={e => setPw(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && confirm()}
                placeholder="Heslo…"
                className={err ? 'err-border' : ''}
                autoComplete="off"
              />
              <button className="eye-btn" onClick={() => setShow(v => !v)}>👁</button>
            </div>
            <div className="modal-err">{err}</div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={onClose}>Zrušit</button>
              <button className="btn btn-primary" onClick={confirm}>Potvrdit →</button>
            </div>
          </div>
        </div>
      );
    }

    /* ── Add Form ───────────────────────────────── */
    function AddForm({ onAdd, onClose }) {
      const [name, setName]   = useState('');
      const [desc, setDesc]   = useState('');
      const [price, setPrice] = useState('');
      const [errs, setErrs]   = useState({});

      const submit = () => {
        const e = {};
        if (!name.trim())                    e.name  = 'Vyplňte prosím název.';
        if (!desc.trim())                    e.desc  = 'Vyplňte prosím popis.';
        if (!price || parseFloat(price) <= 0) e.price = 'Zadejte kladnou cenu.';
        setErrs(e);
        if (Object.keys(e).length) return;
        onAdd({ id: Date.now(), name: name.trim(), desc: desc.trim(), price: parseFloat(price), isNew: true });
      };

      return (
        <section className="form-panel">
          <h2>📦 Nový produkt</h2>
          <div className="form-grid">
            <div className={`field full${errs.name ? ' invalid' : ''}`}>
              <label>Název produktu</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="např. Alpský vzduch de luxe" maxLength={80} />
              {errs.name && <span className="err">{errs.name}</span>}
            </div>
            <div className={`field full${errs.desc ? ' invalid' : ''}`}>
              <label>Popis</label>
              <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={3} placeholder="Co zákazník dostane? Odkud vzduch pochází?" />
              {errs.desc && <span className="err">{errs.desc}</span>}
            </div>
            <div className={`field${errs.price ? ' invalid' : ''}`}>
              <label>Cena (Kč)</label>
              <input type="number" value={price} onChange={e => setPrice(e.target.value)} placeholder="49" min="1" step="0.01" />
              {errs.price && <span className="err">{errs.price}</span>}
            </div>
          </div>
          <div className="form-actions">
            <button className="btn btn-ghost" onClick={onClose}>Zrušit</button>
            <button className="btn btn-primary" onClick={submit}>Přidat produkt →</button>
          </div>
        </section>
      );
    }

    /* ── Product Card ───────────────────────────── */
    function Card({ p, onBuy }) {
      const price = Number(p.price).toLocaleString('cs-CZ');
      return (
        <article className="card">
          <div className="card-thumb">
            💨
            {p.isNew && <span className="badge">Nový</span>}
          </div>
          <div className="card-body">
            <div className="card-name">{esc(p.name)}</div>
            <div className="card-desc">{esc(p.desc)}</div>
          </div>
          <div className="card-footer">
            <div className="card-price">{price} Kč<small>za pytlík</small></div>
            <button className="btn btn-buy" onClick={() => onBuy(p)}>🛒 Koupit</button>
          </div>
        </article>
      );
    }

    /* ── App ────────────────────────────────────── */
    function App() {
      const [products,  setProducts]  = useState(() => loadProducts());
      const [showForm,  setShowForm]  = useState(false);
      const [showPw,    setShowPw]    = useState(false);
      const [buyTarget, setBuyTarget] = useState(null);
      const [toast,     setToast]     = useState({ msg: '', show: false });
      const timer = useRef(null);

      useEffect(() => { saveProducts(products); }, [products]);

      const flash = useCallback(msg => {
        clearTimeout(timer.current);
        setToast({ msg, show: true });
        timer.current = setTimeout(() => setToast(t => ({ ...t, show: false })), 3000);
      }, []);

      const handleAddClick = () => {
        if (showForm) { setShowForm(false); return; }
        setShowPw(true);
      };

      return (
        <>
          <header className="header">
            <div className="header-inner">
              <div className="logo">Air<em>Mart</em></div>
              <div className="tagline">Prémiové tržiště čerstvého vzduchu · Dýcháme za vás</div>
            </div>
          </header>

          <nav className="navbar">
            <div className="count">Nabídka: <b>{products.length}</b> produktů</div>
            <button className="btn btn-add" onClick={handleAddClick}>
              {showForm ? '✕ Zavřít' : '＋ Přidat produkt'}
            </button>
          </nav>

          <main className="main">
            {showForm && (
              <AddForm
                onAdd={p => { setProducts(prev => [p, ...prev]); setShowForm(false); flash('✅ Produkt byl úspěšně přidán!'); }}
                onClose={() => setShowForm(false)}
              />
            )}

            <h2 className="section-title">
              Aktuální nabídka <span>{products.length}</span>
            </h2>

            <div className="grid">
              {products.length === 0
                ? <div className="empty"><div className="icon">💨</div><p>Zatím žádné produkty. Přidejte první!</p></div>
                : products.map(p => <Card key={p.id} p={p} onBuy={setBuyTarget} />)
              }
            </div>
          </main>

          <footer className="footer">© 2025 AirMart s.r.o. · Vzduch je náš byznys</footer>

          <PwModal
            open={showPw}
            onSuccess={() => { setShowPw(false); setShowForm(true); }}
            onClose={() => setShowPw(false)}
          />

          <BuyModal product={buyTarget} onClose={() => setBuyTarget(null)} />

          <Toast msg={toast.msg} show={toast.show} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
