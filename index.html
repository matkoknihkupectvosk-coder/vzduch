<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirMart – Tržiště čerstvého vzduchu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky:        #d6eeff;
      --sky-mid:    #a8d8f0;
      --sky-light:  #edf7ff;
      --blue:       #1a6fa8;
      --blue-dark:  #0e4d7a;
      --accent:     #ff6b35;
      --white:      #ffffff;
      --gray-100:   #f4f8fb;
      --gray-200:   #e2edf5;
      --gray-500:   #7a9ab0;
      --gray-700:   #3a5568;
      --text:       #1b2d3e;
      --radius:     18px;
      --radius-sm:  10px;
      --shadow:     0 4px 24px rgba(26,111,168,.10);
      --shadow-lg:  0 16px 48px rgba(26,111,168,.20);
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--sky);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 15% 5%,  #c4e5ff 0%, transparent 55%),
        radial-gradient(ellipse 55% 75% at 85% 95%, #b0d9f4 0%, transparent 55%),
        radial-gradient(ellipse 40% 50% at 60% 40%, #ddf0ff 0%, transparent 50%);
    }

    /* ── HEADER ────────────────────────────────── */
    .am-header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, #1a5a8c 100%);
      color: var(--white);
      padding: 3rem 2rem 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .am-header::before,
    .am-header::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.05);
    }
    .am-header::before { width: 360px; height: 360px; top: -130px; left: -100px; }
    .am-header::after  { width: 240px; height: 240px; bottom: -80px; right: -60px; }

    .am-header .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    .am-header .logo span { color: var(--sky-mid); }
    .am-header .tagline {
      margin-top: .7rem;
      font-size: .95rem;
      font-weight: 300;
      opacity: .7;
      font-style: italic;
      position: relative;
      z-index: 1;
    }

    /* ── ACTION BAR ─────────────────────────────── */
    .am-action-bar {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--gray-200);
      padding: .85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 16px rgba(26,111,168,.07);
    }
    .am-action-bar .count {
      font-size: .875rem;
      color: var(--gray-500);
      font-weight: 300;
    }
    .am-action-bar .count strong { color: var(--blue); font-weight: 600; }

    /* ── BUTTONS ────────────────────────────────── */
    .btn {
      border: none;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition: transform .15s, box-shadow .15s, background .15s, color .15s, border-color .15s;
    }
    .btn:active { transform: scale(.96) !important; }

    .btn-add {
      background: var(--accent);
      color: var(--white);
      padding: .65rem 1.5rem;
      font-size: .9rem;
      box-shadow: 0 4px 14px rgba(255,107,53,.25);
    }
    .btn-add:hover {
      background: #e0541f;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255,107,53,.35);
    }

    .btn-primary {
      background: var(--blue);
      color: var(--white);
      padding: .65rem 1.6rem;
      font-size: .95rem;
    }
    .btn-primary:hover { background: var(--blue-dark); transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      color: var(--gray-500);
      border: 1.5px solid var(--gray-200);
      padding: .65rem 1.2rem;
      font-size: .95rem;
    }
    .btn-ghost:hover { border-color: var(--gray-500); color: var(--text); }

    .btn-buy {
      background: var(--blue);
      color: var(--white);
      padding: .5rem 1.1rem;
      font-size: .85rem;
      box-shadow: 0 2px 8px rgba(26,111,168,.2);
    }
    .btn-buy:hover { background: var(--blue-dark); transform: scale(1.05); }

    /* ── MAIN ───────────────────────────────────── */
    .am-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── FORM PANEL ─────────────────────────────── */
    .form-panel {
      background: var(--white);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-lg);
      animation: slideDown .3s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-panel h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      color: var(--blue-dark);
      margin-bottom: 1.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem;
    }
    @media (max-width: 580px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: .35rem; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .field input,
    .field textarea {
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: .7rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      color: var(--text);
      background: var(--gray-100);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      resize: vertical;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(26,111,168,.12);
    }
    .field.invalid input,
    .field.invalid textarea { border-color: #d9534f; }

    .field .error-msg {
      font-size: .78rem;
      color: #d9534f;
      font-weight: 500;
    }

    .form-actions {
      display: flex;
      gap: .75rem;
      margin-top: 1.5rem;
      justify-content: flex-end;
    }

    /* ── SECTION HEADING ────────────────────────── */
    .section-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--blue-dark);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    /* ── PRODUCT GRID ───────────────────────────── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    /* ── PRODUCT CARD ───────────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform .25s, box-shadow .25s;
      animation: cardIn .4s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow-lg);
    }

    .card-img {
      height: 190px;
      background: linear-gradient(135deg, var(--sky-light) 0%, var(--sky-mid) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      position: relative;
      overflow: hidden;
    }
    .card-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 82%, rgba(255,255,255,.55) 9px, transparent 9px),
        radial-gradient(circle at 72% 22%, rgba(255,255,255,.45) 6px, transparent 6px),
        radial-gradient(circle at 55% 68%, rgba(255,255,255,.4)  5px, transparent 5px),
        radial-gradient(circle at 88% 55%, rgba(255,255,255,.35) 4px, transparent 4px);
    }

    .badge-new {
      position: absolute;
      top: 14px; right: 14px;
      background: var(--accent);
      color: var(--white);
      font-size: .68rem;
      font-weight: 600;
      padding: .22rem .6rem;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: .07em;
      z-index: 1;
      box-shadow: 0 3px 10px rgba(255,107,53,.4);
    }

    .card-body {
      padding: 1.35rem 1.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }

    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      line-height: 1.3;
      color: var(--blue-dark);
    }

    .card-desc {
      font-size: .875rem;
      color: var(--gray-700);
      font-weight: 300;
      line-height: 1.55;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.4rem 1.2rem;
      border-top: 1.5px solid var(--gray-200);
      background: var(--gray-100);
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -.03em;
    }
    .card-price small {
      font-size: .7rem;
      font-weight: 400;
      color: var(--gray-500);
      display: block;
      margin-top: -1px;
    }

    /* ── EMPTY STATE ────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      grid-column: 1 / -1;
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 1rem; }
    .empty-state p {
      color: var(--gray-500);
      font-weight: 300;
      font-style: italic;
      font-size: 1.05rem;
    }

    /* ── TOAST ──────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      background: var(--blue-dark);
      color: var(--white);
      padding: .9rem 1.8rem;
      border-radius: 50px;
      font-size: .9rem;
      font-weight: 500;
      box-shadow: 0 10px 36px rgba(14,77,122,.35);
      z-index: 999;
      white-space: nowrap;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── MODAL ──────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,30,50,.5);
      backdrop-filter: blur(5px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal-box {
      background: var(--white);
      border-radius: var(--radius);
      padding: 2.25rem 2rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 72px rgba(14,77,122,.28);
      transform: scale(.9) translateY(20px);
      transition: transform .32s cubic-bezier(.34,1.56,.64,1);
      text-align: center;
    }
    .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }

    .modal-icon { font-size: 2.8rem; margin-bottom: .6rem; }
    .modal-box h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      color: var(--blue-dark);
      margin-bottom: .4rem;
    }
    .modal-box p {
      font-size: .87rem;
      color: var(--gray-500);
      font-weight: 300;
      margin-bottom: 1.4rem;
    }

    .pw-wrap { position: relative; margin-bottom: .5rem; }
    .pw-wrap input {
      width: 100%;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: .75rem 3rem .75rem 1.1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      text-align: center;
      letter-spacing: .12em;
      color: var(--text);
      background: var(--gray-100);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .pw-wrap input:focus {
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(26,111,168,.12);
    }
    .pw-wrap input.invalid { border-color: #d9534f; }

    .eye-btn {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--gray-500);
      padding: .2rem;
      line-height: 1;
    }

    .modal-error {
      font-size: .8rem;
      color: #d9534f;
      min-height: 1.2rem;
      margin-bottom: .9rem;
      font-weight: 500;
    }

    .modal-actions { display: flex; gap: .65rem; }
    .modal-actions .btn-primary { flex: 1; }
    .modal-actions .btn-ghost   { flex: 0 0 auto; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }
    .pw-wrap.shake input { animation: shake .4s ease; border-color: #d9534f; }

    /* ── FOOTER ─────────────────────────────────── */
    .am-footer {
      text-align: center;
      padding: 1.75rem;
      font-size: .8rem;
      color: var(--gray-500);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    const STORAGE_KEY    = 'airmart_products';
    const CORRECT_PW     = 'jejux';

    const DEFAULT_PRODUCTS = [
      { id: 1, name: 'Čerstvý vzduch v pytlíku – Originál',  desc: 'Náš bestseller. Vzduch pečlivě nasbíraný v českých horách, balený za úsvitu. Bez konzervantů, bez přidaného kyslíku.', price: 49,  isNew: false },
      { id: 2, name: 'Alpský vzduch Premium',                desc: 'Luxusní směs ze švýcarských Alp ve výšce 3 000 m n. m. Krystalicky čistý, s nádechem sněhu a svobody.',                price: 199, isNew: false },
      { id: 3, name: 'Mořský vánek – edice léto',            desc: 'Jemně osolený vzduch z pobřeží Jadranského moře. Ideální pro domácí saunování nebo meditaci.',                           price: 89,  isNew: false },
    ];

    function loadProducts() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return DEFAULT_PRODUCTS;
    }

    function saveProducts(products) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ── Toast ───────────────────────────────────── */
    function Toast({ message, visible }) {
      return <div className={`toast${visible ? ' show' : ''}`}>{message}</div>;
    }

    /* ── Password Modal ──────────────────────────── */
    function PasswordModal({ open, onSuccess, onClose }) {
      const [pw, setPw]           = useState('');
      const [showPw, setShowPw]   = useState(false);
      const [error, setError]     = useState('');
      const [shaking, setShaking] = useState(false);
      const inputRef              = useRef(null);

      useEffect(() => {
        if (open) {
          setPw(''); setError(''); setShowPw(false);
          setTimeout(() => inputRef.current?.focus(), 200);
        }
      }, [open]);

      const confirm = () => {
        if (pw === CORRECT_PW) {
          onSuccess();
        } else {
          setError('❌ Špatné heslo. Zkuste to znovu.');
          setShaking(true);
          setPw('');
          setTimeout(() => { setShaking(false); inputRef.current?.focus(); }, 420);
        }
      };

      const handleKey = e => { if (e.key === 'Enter') confirm(); };
      const handleOverlay = e => { if (e.target === e.currentTarget) onClose(); };

      return (
        <div className={`modal-overlay${open ? ' open' : ''}`} onClick={handleOverlay}>
          <div className="modal-box">
            <div className="modal-icon">🔐</div>
            <h3>Chráněná sekce</h3>
            <p>Pro přidání produktu zadejte heslo správce.</p>
            <div className={`pw-wrap${shaking ? ' shake' : ''}`}>
              <input
                ref={inputRef}
                type={showPw ? 'text' : 'password'}
                value={pw}
                onChange={e => setPw(e.target.value)}
                onKeyDown={handleKey}
                placeholder="Heslo…"
                className={error ? 'invalid' : ''}
                autoComplete="off"
              />
              <button className="eye-btn" onClick={() => setShowPw(v => !v)} title="Zobrazit/skrýt heslo">👁</button>
            </div>
            <div className="modal-error">{error}</div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={onClose}>Zrušit</button>
              <button className="btn btn-primary" onClick={confirm}>Potvrdit →</button>
            </div>
          </div>
        </div>
      );
    }

    /* ── Add Product Form ────────────────────────── */
    function AddForm({ onAdd, onClose }) {
      const [name,  setName]  = useState('');
      const [desc,  setDesc]  = useState('');
      const [price, setPrice] = useState('');
      const [errors, setErrors] = useState({});

      const validate = () => {
        const e = {};
        if (!name.trim())              e.name  = 'Vyplňte prosím název.';
        if (!desc.trim())              e.desc  = 'Vyplňte prosím popis.';
        if (!price || parseFloat(price) <= 0) e.price = 'Zadejte kladnou cenu.';
        return e;
      };

      const submit = () => {
        const e = validate();
        setErrors(e);
        if (Object.keys(e).length) return;
        onAdd({ id: Date.now(), name: name.trim(), desc: desc.trim(), price: parseFloat(price), isNew: true });
      };

      return (
        <section className="form-panel">
          <h2>📦 Nový produkt</h2>
          <div className="form-grid">
            <div className={`field full${errors.name ? ' invalid' : ''}`}>
              <label>Název produktu</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="např. Alpský vzduch de luxe" maxLength={80} />
              {errors.name && <span className="error-msg">{errors.name}</span>}
            </div>
            <div className={`field full${errors.desc ? ' invalid' : ''}`}>
              <label>Popis</label>
              <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={3} placeholder="Co zákazník dostane? Odkud vzduch pochází?" />
              {errors.desc && <span className="error-msg">{errors.desc}</span>}
            </div>
            <div className={`field${errors.price ? ' invalid' : ''}`}>
              <label>Cena (Kč)</label>
              <input type="number" value={price} onChange={e => setPrice(e.target.value)} placeholder="49" min="1" step="0.01" />
              {errors.price && <span className="error-msg">{errors.price}</span>}
            </div>
          </div>
          <div className="form-actions">
            <button className="btn btn-ghost" onClick={onClose}>Zrušit</button>
            <button className="btn btn-primary" onClick={submit}>Přidat produkt →</button>
          </div>
        </section>
      );
    }

    /* ── Product Card ────────────────────────────── */
    function ProductCard({ product, onBuy }) {
      const priceFormatted = Number(product.price).toLocaleString('cs-CZ');
      return (
        <article className="card">
          <div className="card-img">
            💨
            {product.isNew && <span className="badge-new">Nový</span>}
          </div>
          <div className="card-body">
            <div className="card-name">{escapeHTML(product.name)}</div>
            <div className="card-desc">{escapeHTML(product.desc)}</div>
          </div>
          <div className="card-footer">
            <div className="card-price">
              {priceFormatted} Kč
              <small>za pytlík</small>
            </div>
            <button className="btn btn-buy" onClick={() => onBuy(product)}>
              🛒 Koupit
            </button>
          </div>
        </article>
      );
    }

    /* ── App ─────────────────────────────────────── */
    function AirMartApp() {
      const [products,    setProducts]    = useState(() => loadProducts());
      const [showForm,    setShowForm]    = useState(false);
      const [showModal,   setShowModal]   = useState(false);
      const [toast,       setToast]       = useState({ message: '', visible: false });
      const toastTimer = useRef(null);

      useEffect(() => { saveProducts(products); }, [products]);

      const showToast = useCallback(msg => {
        clearTimeout(toastTimer.current);
        setToast({ message: msg, visible: true });
        toastTimer.current = setTimeout(() => setToast(t => ({ ...t, visible: false })), 3000);
      }, []);

      const handleAddClick = () => {
        if (showForm) { setShowForm(false); return; }
        setShowModal(true);
      };

      const handlePasswordOk = () => {
        setShowModal(false);
        setShowForm(true);
      };

      const handleAddProduct = product => {
        setProducts(prev => [product, ...prev]);
        setShowForm(false);
        showToast('✅ Produkt byl úspěšně přidán!');
      };

      const handleBuy = product => {
        const price = Number(product.price).toLocaleString('cs-CZ');
        alert(`🎉 Děkujeme za nákup!\n\nProdukt: ${product.name}\nCena: ${price} Kč\n\nVáš pytlík čerstvého vzduchu je na cestě. 💨`);
      };

      return (
        <>
          <header className="am-header">
            <div className="logo">Air<span>Mart</span></div>
            <div className="tagline">Prémiové tržiště čerstvého vzduchu · Dýcháme za vás</div>
          </header>

          <div className="am-action-bar">
            <div className="count">
              Nabídka: <strong>{products.length}</strong> produktů
            </div>
            <button className="btn btn-add" onClick={handleAddClick}>
              {showForm ? '✕ Zavřít formulář' : '＋ Přidat produkt'}
            </button>
          </div>

          <main className="am-main">
            {showForm && (
              <AddForm onAdd={handleAddProduct} onClose={() => setShowForm(false)} />
            )}

            <h2 className="section-heading">🌬️ Aktuální nabídka</h2>

            <div className="products-grid">
              {products.length === 0 ? (
                <div className="empty-state">
                  <div className="icon">💨</div>
                  <p>Žádné produkty zatím. Přidejte první!</p>
                </div>
              ) : (
                products.map(p => (
                  <ProductCard key={p.id} product={p} onBuy={handleBuy} />
                ))
              )}
            </div>
          </main>

          <footer className="am-footer">© 2025 AirMart s.r.o. · Vzduch je náš byznys</footer>

          <PasswordModal
            open={showModal}
            onSuccess={handlePasswordOk}
            onClose={() => setShowModal(false)}
          />

          <Toast message={toast.message} visible={toast.visible} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AirMartApp />);
  </script>
</body>
</html>
